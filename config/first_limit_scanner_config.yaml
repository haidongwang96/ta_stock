# 首板放量涨停板筛选器配置文件
# 配置说明：本文件包含所有可配置的参数，方便记录和对比不同策略

# ==================== 扫描日期范围 ====================
date_range:
  start_date: "20241128"  # 扫描开始日期，格式YYYYMMDD
  end_date: "20241205"    # 扫描结束日期，格式YYYYMMDD

# ==================== 数据源配置 ====================
data_source:
  stock_pool: "pool/stock_pool_all.txt"  # 股票池文件路径
  use_local_db: true                      # 是否使用本地数据库

# ==================== 筛选条件参数 ====================
filter_conditions:
  # 价格过滤
  min_price: 3.0    # 最低价格（元），过滤低价股
  max_price: 500.0  # 最高价格（元），过滤高价股

  # 放量条件
  volume_multiple: 2.0  # 放量倍数（相对前一日），默认2倍

  # 涨停板判断容差
  limit_up_tolerance: 0.05  # 涨停容差（%），允许9.95%-10%都算涨停

  # 半年内高点限制
  half_year_high_limit: 30  # 半年最高价距离当前价的百分比上限（%）

  # 一个月内跌幅限制
  one_month_drop_limit: 10  # 一个月内跌幅上限（%）

  # 连续K线检查
  continuous_candle_days: 4  # 检查连续阳线/阴线的天数

# ==================== 交易策略参数 ====================
trading_strategy:
  buy_timing: "next_day_open"       # 买入时机：下一日开盘
  sell_timing: "next_next_day_open" # 卖出时机：下下个交易日开盘
  description: "第二个交易日开盘买入，第三个交易日开盘卖出"

# ==================== 输出配置 ====================
output:
  output_dir: "first_limit_premium_results"  # 输出目录
  file_prefix: "signal_detail_table"         # 输出文件前缀

  # 输出内容控制
  show_surrounding_days: 3  # 显示触发日前后的天数

# ==================== 运行模式 ====================
run_mode:
  test_mode: false    # 测试模式（仅扫描前10只股票）
  verbose: false      # 详细输出模式

# ==================== 备注信息 ====================
# 可以在这里添加当前配置的备注，方便后续查看
notes: |
  默认配置 - 基础首板放量涨停板策略
  筛选条件：
  - 涨停板（主板10%、科创板/创业板20%）
  - 放量2倍以上
  - 半年高点距离30%以内
  - 一个月跌幅10%以内
  - 无连续4天阳线或阴线

  交易策略：
  - T+2交易（第二日买入，第三日卖出）

  创建时间: 2025-12-05
  版本: v1.0
